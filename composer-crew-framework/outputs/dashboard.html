
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musicom Framework Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; color: white; padding: 2rem; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border: 1px solid #1e293b; border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; }
    svg { width: 100%; height: auto; display: block; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .card { background: rgba(15, 23, 42, 0.5); border: 1px solid #1e293b; border-radius: 0.75rem; padding: 1.5rem; }
    .card h3 { font-size: 0.875rem; color: #22d3ee; margin-bottom: 0.5rem; }
    .card p { color: #94a3b8; font-size: 0.75rem; line-height: 1.5; }
    .btn { display: inline-block; padding: 0.5rem 1rem; background: #22d3ee; color: #020617; border-radius: 4px; text-decoration: none; font-size: 0.75rem; font-weight: bold; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="pulse-dot"></div>
      <h1>Musicom Composer Dashboard</h1>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 400">
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
        
        <!-- Workflow Nodes -->
        <rect x="50" y="150" width="150" height="100" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" />
        <text x="125" y="200" fill="white" font-size="12" text-anchor="middle">Theoretician</text>
        <text x="125" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">Scales/Modes</text>

        <rect x="250" y="150" width="150" height="100" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" />
        <text x="325" y="200" fill="white" font-size="12" text-anchor="middle">Melodist</text>
        <text x="325" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">Patterns/Motifs</text>

        <rect x="450" y="150" width="150" height="100" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" />
        <text x="525" y="200" fill="white" font-size="12" text-anchor="middle">Arranger</text>
        <text x="525" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">Matrix Render</text>

        <!-- Connections -->
        <line x1="200" y1="200" x2="250" y2="200" stroke="#94a3b8" stroke-dasharray="4" />
        <line x1="400" y1="200" x2="450" y2="200" stroke="#22d3ee" stroke-dasharray="4" />
      </svg>
    </div>

    <div class="cards">
      <div class="card">
        <h3>Recent Composition</h3>
        <p>Mysterious Jazz Layered</p>
        <p>Key: D Dorian | BPM: 100</p>
        <a href="https://t.me/c/8684633270" class="btn">Listen on Telegram</a>
      </div>
      <div class="card">
        <h3>Matrix Status</h3>
        <p>Layers: 3 (Lead, Pad, Bass)</p>
        <p>Measures: 4 active</p>
      </div>
      <div class="card">
        <h3>System Status</h3>
        <p>Role: Integrated Context</p>
        <p>Provider: Gemini 3 Flash</p>
      </div>
    </div>
  </div>
</body>
</html>
