<!DOCTYPE html>
<html lang="en">
<head>

    <title>{{project_name}} | Musicom Agent</title>

    </div>
    <div class="card">
        <a href="{{bandlab_url}}">Open in BandLab</a>
    </div>
</body>
</html>
