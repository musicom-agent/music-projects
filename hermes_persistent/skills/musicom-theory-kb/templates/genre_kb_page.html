<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Musicom Genre KB | {{GENRE_NAME}}</title>
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'JetBrains Mono', monospace; padding: 2rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .card { background: #0f172a; border-left: 4px solid #22d3ee; padding: 1.5rem; border-radius: 4px; }
        h1, h2 { color: #22d3ee; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; }
        .rose { color: #fb7185; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #1e293b; }
        th { color: #fb7185; }
        pre { background: #1e293b; padding: 1rem; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Genre Knowledge Base: {{GENRE_NAME}}</h1>
    <div class="grid">
        <div class="card">
            <h2>Theory & Metrical DNA</h2>
            {{THEORY_BODY}}
        </div>
        <div class="card">
            <h2>Audio Examples</h2>
            <audio controls src="{{AUDIO_PATH}}"></audio>
            {{PATTERN_PRE}}
        </div>
    </div>
    <h2>Pattern Comparison</h2>
    {{COMPARISON_TABLE}}
</body>
</html>
